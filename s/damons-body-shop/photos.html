<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  line-height: 1.6;
  background: #f7f7f4;
  color: #222;
  padding: 0;
  min-height: 100vh;
}
.container {
  max-width: 600px;
  width: 100%;
  margin: 0 auto;
  padding: 1.5rem 1rem;
}
.header {
  text-align: center;
  margin-bottom: 1.5rem;
}
h1 {
  font-size: 2rem;
  font-weight: 700;
  margin-bottom: 0.25rem;
  color: #111;
}
.category {
  font-size: 1rem;
  color: #666;
  margin-bottom: 0.25rem;
  text-transform: capitalize;
}
.location {
  font-size: 0.95rem;
  color: #666;
  margin-bottom: 1rem;
}
.call-section {
  position: sticky;
  bottom: 0;
  background: #f7f7f4;
  padding: 1rem 0;
  text-align: center;
  border-top: 1px solid #ddd;
}
.phone {
  font-size: 1.25rem;
  margin-bottom: 0.75rem;
  font-weight: 600;
}
.call-btn {
  display: inline-block;
  background: #0066cc;
  color: #fff;
  text-decoration: none;
  padding: 1rem 3rem;
  border-radius: 12px;
  font-size: 1.25rem;
  font-weight: 700;
  transition: background 0.2s;
}
.call-btn:hover {
  background: #0052a3;
}
.footer {
  margin-top: 1.5rem;
  font-size: 0.85rem;
  color: #999;
  text-align: center;
  padding-bottom: 1rem;
}
.footer a {
  color: #0066cc;
  text-decoration: none;
}
@media (max-width: 640px) {
  h1 { font-size: 1.75rem; }
  .phone { font-size: 1.1rem; }
  .call-btn { font-size: 1.1rem; padding: 0.9rem 2.5rem; }
